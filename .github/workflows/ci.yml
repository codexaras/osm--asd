# =====================================================================
#  CI - runs on every push / pull request
#  backend tests -> frontend build -> monitoring config checks
#  -> docker image build -> full-stack smoke test with docker compose
# =====================================================================
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint (syntax check)
        run: npm run lint
      - name: Unit + integration tests (ephemeral MongoDB)
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/resourcehub
          JWT_SECRET: ci-secret
          NODE_ENV: test

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  monitoring:
    name: Monitoring config - validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 check rules /etc/prometheus/alert.rules.yml
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 check config --syntax-only /etc/prometheus/prometheus.yml
      - name: Grafana dashboards are valid JSON and up to date with the generator
        run: |
          cp -r monitoring/grafana/dashboards /tmp/committed
          python3 scripts/grafana/build_dashboards.py
          diff -r /tmp/committed monitoring/grafana/dashboards
          for f in monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "OK $f"; done
      - name: docker compose config
        run: docker compose config --quiet

  docker:
    name: Docker - build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: resourcehub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: resourcehub-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  smoke-test:
    name: Full stack smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: [docker, monitoring]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 240
          docker compose ps

      - name: App - frontend, health, login through nginx proxy
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">"
          curl -fsS http://localhost:5000/api/health | tee /dev/stderr | grep -q '"status":"UP"'
          TOKEN=$(curl -fsS http://localhost:8080/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"admin@resourcehub.com","password":"Admin@123"}' | jq -r .data.token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -fsS http://localhost:8080/api/dashboard -H "Authorization: Bearer $TOKEN" | jq '.data.stats'

      - name: Generate traffic for 45s
        run: |
          docker run --rm --network resourcehub_backend-net -e API_URL=http://backend:5000/api -e RPS=6 -e DURATION_SECONDS=45 \
            -v "$PWD/scripts/traffic-generator.js:/t.js:ro" node:22-alpine node /t.js

      - name: Prometheus - targets up and metrics ingested
        run: |
          for i in $(seq 1 30); do
            UP=$(curl -fsS 'http://localhost:9090/api/v1/query?query=up{job="resourcehub-api"}' | jq -r '.data.result[0].value[1]')
            [ "$UP" = "1" ] && break; sleep 2
          done
          test "$UP" = "1"
          curl -fsS http://localhost:9090/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job)\t\(.health)"'
          REQS=$(curl -fsS 'http://localhost:9090/api/v1/query?query=sum(rh_http_requests_total)' | jq -r '.data.result[0].value[1]')
          echo "rh_http_requests_total = $REQS"; test "${REQS%.*}" -gt 50
          curl -fsS 'http://localhost:9090/api/v1/query?query=sum(rh_resources)' | jq -e '.data.result[0].value[1] | tonumber > 0'

      - name: Grafana - datasource healthy and dashboards provisioned
        run: |
          curl -fsS -u admin:admin http://localhost:3000/api/datasources/uid/prometheus/health | tee /dev/stderr | jq -e '.status == "OK"'
          curl -fsS -u admin:admin 'http://localhost:3000/api/search?tag=resourcehub' | jq -r '.[].title'
          curl -fsS -u admin:admin http://localhost:3000/api/dashboards/uid/resourcehub-overview | jq -e '.dashboard.panels | length > 20'
          curl -fsS -u admin:admin http://localhost:3000/api/dashboards/uid/resourcehub-infra | jq -e '.dashboard.panels | length > 10'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
